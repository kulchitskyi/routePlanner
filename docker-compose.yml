services:
  db:
    image: postgis/postgis:16-3.4
    container_name: postgres_db
    
    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}


    ports:
      - "${DB_PORT}:${DB_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_api_server
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    volumes:
      - ./public:/app/public

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

    restart: always

  redis:
    image: 'redis:7-alpine'
    restart: always
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    environment:
      - GF_LOG_LEVEL=warn
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    restart: always

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml -log.level=warn
    volumes:
      - ./configs/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    restart: always

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/log:/var/log
      - ./configs/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml -log.level=warn
    depends_on:
      - loki
    restart: always

  llm-service:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    env_file:
      - .env
    ports:
      - "${OLLAMA_PORT}:11434"

  casdoor:
    image: casbin/casdoor-all-in-one:latest
    container_name: casdoor
    ports:
      - "8000:8000"
    restart: always

volumes:
  postgres_data:
    driver: local
  ollama_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data: